name: Check

# 仓库公开，这里只检查能编译，不上传安装包
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只读代码，不需要写权限
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # 后面的 pub get、Gradle 跑的是第三方代码，不把令牌留在 .git/config 里

      - name: Require a release commit for app changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # 应用代码变了却没有 fix:/feat: 提交，release-please 就不会发版
          if git diff --name-only "$BASE...$HEAD" | grep -qE '^(lib|android|macos|windows|assets)/' \
            && ! git log --format=%s "$BASE..$HEAD" | grep -qE '^(feat|fix)(\(.+\))?!?: '; then
            echo "::error::改了应用代码，至少要有一个 fix: 或 feat: 开头的提交"
            exit 1
          fi

      - name: Decide which platforms to build
        id: platforms
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # 手动运行时编译全部平台；PR 只编译改动涉及的平台，依赖变了才全编
          platforms=android,macos,windows
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --name-only "$BASE...$HEAD")
            if ! grep -qx pubspec.lock <<<"$files"; then
              platforms=
              grep -qE '^(lib|assets|android)/' <<<"$files" && platforms+=android,
              grep -q '^macos/' <<<"$files" && platforms+=macos,
              grep -q '^windows/' <<<"$files" && platforms+=windows,
            fi
          fi
          echo "platforms=$platforms" | tee -a "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  build:
    name: build (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            args: apk --release --target-platform android-arm64 --dart-define=cronetHttpNoPlay=true --split-debug-info=build/app/outputs/symbols
          - platform: windows
            os: windows-2022 # windows-latest 的 VS 2026 编不过 flutter_inappwebview_windows（STL1011）
            args: windows --release --split-debug-info=build/app/outputs/symbols
          - platform: macos
            os: macos-latest
            args: macos --release --split-debug-info=build/app/outputs/symbols
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # 保护规则要求这些任务都有结果，所以跳过步骤而不是跳过任务
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: contains(needs.check.outputs.platforms, matrix.platform)
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.platform == 'android' && contains(needs.check.outputs.platforms, matrix.platform)
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: matrix.platform == 'android' && contains(needs.check.outputs.platforms, matrix.platform)
        with:
          cache-read-only: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: contains(needs.check.outputs.platforms, matrix.platform)
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      # flutter_inappwebview_macos 用 Swift Package Manager 编译会报错，改用 CocoaPods
      - if: matrix.platform == 'macos' && contains(needs.check.outputs.platforms, matrix.platform)
        run: flutter config --no-enable-swift-package-manager

      - name: Cache CocoaPods
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: matrix.platform == 'macos' && contains(needs.check.outputs.platforms, matrix.platform)
        with:
          path: |
            macos/Pods
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('macos/Podfile.lock', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache NuGet / WebView2
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: matrix.platform == 'windows' && contains(needs.check.outputs.platforms, matrix.platform)
        with:
          path: |
            ~/.nuget/packages
            ~/AppData/Local/NuGet/v3-cache
            build/windows/x64/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('pubspec.lock', 'windows/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build
        if: matrix.platform != 'android' && contains(needs.check.outputs.platforms, matrix.platform)
        run: flutter build ${{ matrix.args }} -t lib/next/main.dart

      # Gradle 和 Kotlin 编译器从 GitHub releases 下载，常遇到 504/网络抖动；仅命中网络/下载/超时错误时重试，真实编译错误立即失败
      - name: Build (android)
        if: matrix.platform == 'android' && contains(needs.check.outputs.platforms, matrix.platform)
        run: |
          set -o pipefail
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          network_err='timed out|SocketTimeoutException|ConnectTimeoutException|UnknownHostException|SSLException|SSLHandshakeException|Connection reset|Connection refused|Connection closed|Remote host terminated|Premature EOF|Unexpected end of file|Could not resolve host|Temporary failure in name resolution|Could not (GET|HEAD|download)|Failed to download|Error downloading|(status code:? |HTTP )(429|50[0234])|502 Bad Gateway|503 Service Unavailable|504 Gateway|429 Too Many Requests'
          for attempt in 1 2 3; do
            if flutter build ${{ matrix.args }} -t lib/next/main.dart 2>&1 | tee "$log"; then
              exit 0
            fi
            if [ "$attempt" = 3 ] || ! grep -qiE "$network_err" "$log"; then
              exit 1
            fi
            echo "::warning::检测到网络/下载类错误，120 秒后进行第 $((attempt + 1)) 次重试"
            sleep 120
          done
